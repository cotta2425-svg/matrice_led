<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controllo Matrice Arduino R4</title>
    <!-- Libreria MQTT via WebSockets -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h1 { margin-bottom: 1.5rem; font-size: 1.5rem; color: #38bdf8; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 1rem;
            border: 1px solid #334155;
            border-radius: 6px;
            background-color: #0f172a;
            color: #fff;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #0369a1; }
        #status { margin-top: 1rem; font-size: 0.875rem; color: #94a3b8; }
    </style>
</head>
<body>

<div class="card">
    <h1>Matrice LED Arduino</h1>
    <input type="text" id="testo" placeholder="Scrivi il messaggio..." maxlength="50">
    <button onclick="inviaMessaggio()">Invia a LED</button>
    <p id="status">Connessione in corso...</p>
</div>

<script>
    // Connessione al broker MQTT tramite WebSocket SSL
    const client = mqtt.connect('wss://broker.hivemq.com:8000/mqtt');
    const topic = 'mio_arduino_r4_led/testo';

    client.on('connect', () => {
        document.getElementById('status').innerText = 'Stato: Connesso al Cloud!';
        document.getElementById('status').style.color = '#4ade80';
    });

    client.on('error', (err) => {
        document.getElementById('status').innerText = 'Errore di connessione!';
        document.getElementById('status').style.color = '#f87171';
    });

    function inviaMessaggio() {
        const testo = document.getElementById('testo').value;
        if (testo.trim() !== '') {
            client.publish(topic, testo);
            document.getElementById('status').innerText = 'Inviato: "' + testo + '"';
            document.getElementById('testo').value = '';
        }
    }
</script>

</body>
</html>
